[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytackle"
version = "0.1.0"
description = "Small CLI utility collection dispatched from a single entry point"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.1",
    "six>=1.16.0",
    "urllib3>=1.26.13",
    "beautifulsoup4>=4.13.4",
    "python-dotenv>=1.0.0",
    "dash>=2.0.0",
    "pandas>=1.3.0",
    "plotly>=5.0.0",
    "sqlalchemy>=1.4.0",
]

[project.scripts]
pytackle = "tackles._cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tackles*"]

[tool.setuptools]
py-modules = ["EnvDefault"]
