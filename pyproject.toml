[build-system]
requires = ["setuptools>=82.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytackle"
version = "0.1.0"
description = "Small CLI utility collection dispatched from a single entry point"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.33.0",
    "six>=1.17.0",
    "urllib3>=2.6.0",
    "beautifulsoup4>=4.14.0",
    "python-dotenv>=1.2.0",
    "dash>=4.1.0",
    "pandas>=3.0.0",
    "plotly>=6.6.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
pytackle = "tackles._cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tackles*", "common*"]

[tool.setuptools]
py-modules = ["EnvDefault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
